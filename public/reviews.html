    <main class="py-4 reviewBody">
    <div class="container pb-4">
        <!-- Post New Review  -->
        <div class="row justify-content-center mb-5">
        <div class="col-md-8 reviewCon">
            <div class="card" style="border-radius: 20px; border: 3px dashed var(--primary-color); background-color: var(--bg-cream);">
            <div class="card-body p-4">
                <h4 class="text-center mb-4" style="color: var(--primary-color); font-weight: 700;">
                Share Your Experience
                </h4>
                <form id="createReviewForm">
                <!-- Name -->
                <div class="mb-3">
                    <label for="newReviewName" class="form-label fw-bold">Name</label>
                    <input type="text" class="form-control" id="newReviewName" required placeholder="Let the community know who you are">
                </div>
                <!-- Star Rating -->
                <div class="mb-3">
                    <label class="form-label fw-bold">Rating</label>
                    <div class="star-rating">
                    <input type="radio" id="star5" name="rating" value="5" required>
                    <label for="star5" title="5 stars">★</label>
                    
                    <input type="radio" id="star4" name="rating" value="4">
                    <label for="star4" title="4 stars">★</label>
                    
                    <input type="radio" id="star3" name="rating" value="3">
                    <label for="star3" title="3 stars">★</label>
                    
                    <input type="radio" id="star2" name="rating" value="2">
                    <label for="star2" title="2 stars">★</label>
                    
                    <input type="radio" id="star1" name="rating" value="1">
                    <label for="star1" title="1 star">★</label>
                    </div>
                </div>

                <!-- Description -->
                <div class="mb-3">
                    <label for="newReviewDescription" class="form-label fw-bold">Your Review</label>
                    <textarea class="form-control" id="newReviewDescription" rows="4" required placeholder="Share your thoughts..."></textarea>
                </div>

                <button type="submit" class="btn btn-primary w-100">Post Review</button>
                </form>
            </div>
            </div>
        </div>
        </div>

        <!-- All Reviews  -->
        <div class="row justify-content-center">
        <div class="col-12">
            <h3 class="mb-4 text-center communityTitle" style="color: var(--secondary-color); font-weight: 700;">
            Community Reviews
            </h3>
            <div id="reviewsGrid" class="row g-4">
            <div class="col-12 text-center">
                <p class="text-muted">Loading reviews...</p>
            </div>
            </div>
        </div>
        </div>
