              <a class="nav-link" href="index.html">Home</a>

            <li class="nav-item">

            <li class="nav-item">

        <div class="collapse navbar-collapse" id="navbarNav">

    <main class="py-0">
        <div class="container-fluid p-0">
            <div class="shop-background">
            <!-- Pet Shop Button -->
            <button class="enter-btn pet-shop-btn" onclick="openPetShop()">
                <div class="enter-text">ENTER</div>
                <div class="shop-desc">Adopt A Pet!</div>
            </button>
            
            <!-- Power Shop Button -->
            <button class="enter-btn power-shop-btn" onclick="openPowerShop()">
                <div class="enter-text">ENTER</div>
                <div class="shop-desc">Unlock Abilities!</div>
            </button>
            </div>
        </div>

        <!-- Pet Shop Modal -->
        <div class="modal fade" id="petShopModal" tabindex="-1">
            <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                <h3 class="modal-title center" style="color: var(--primary-color); font-weight: 700;">Pet Shop</h3>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                <div id="petShopContent" class="row">
                    <p class="text-center">pets here</p>
                </div>
                </div>
            </div>
            </div>
        </div>

        <!-- Power Shop Modal -->
        <div class="modal fade" id="powerShopModal" tabindex="-1">
            <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                <h3 class="modal-title" style="color: var(--accent-color); font-weight: 700;"> Power-Ups</h3>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                <div id="powerShopContent" class="row">
                    <p class="text-center">abilities here</p>
                </div>
                </div>
            </div>
            </div>
        </div>

        <!-- Name Pet Modal -->
        <div class="modal fade" id="namePetModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="background-color: white; border-radius: 16px; box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.3); border: 2px solid var(--border-color); ">
            <div class="modal-body p-4">
                <button type="button" class="btn-close position-absolute top-0 end-0 m-3" data-bs-dismiss="modal"></button>
                <form id="namePetForm">
                <div class="mb-3">
                    <label for="petNameInput" class="form-label fw-bold" style="color: var(--text-dark);">Pet Name</label>
                    <input type="text" class="form-control" id="petNameInput" required placeholder="Enter a cute name...">
                </div>
                <button type="submit" class="btn btn-secondary w-100">Adopt Pet</button>
                </form>
            </div>
            </div>
        </div>
        </div>
    </main>

    <footer class="mt-auto py-3 bg-primary text-bg-primary text-center">
      <p class="m-0 py-0 px-4">
        Seville's Home © 2026 BED CA2. All Rights Reserved
      </p>
    </footer>

        <!-- Toast Container -->
    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 9999;">
    <div id="notificationToast" class="toast" role="alert">
        <div class="toast-header" id="toastHeader">
        <strong class="me-auto" id="toastTitle">Notification</strong>
        <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
        </div>
        <div class="toast-body" id="toastMessage"></div>
    </div>
    </div>
