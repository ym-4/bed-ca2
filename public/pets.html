    <main class="py-4">
    <div class="container pb-4">
        <h2 class="mb-4 p-3 text-center myPets" style="color: var(--secondary-color); font-weight: 700; border-radius: 15px;">
            My Pets &#10047; Collection
        </h2>
        <!-- Equipped Pet Section -->
        <div class="row justify-content-center mb-5">
        <div class="col-12">
            <div id="equippedPetContainer">
            <div class="card equipped-pet-card">
                <div class="card-body p-0">
                <div class="row g-0 align-items-center">
                    <div class="col-md-5 equipped-pet-image-section">
                    <div class="equipped-image-container">
                        <img id="equippedPetImage" class="equipped-pet-img" src="" alt="Pet" style="display: none;">
                        <div id="noEquippedPetMsg" class="no-pet-msg">
                        <p class="no-pet-icon">&#9787;</p>
                        <p class="no-pet-text">Equip a pet to see it here!</p>
                        </div>
                    </div>
                    </div>
                    
                    <div class="col-md-7 p-4">
                    <h3 id="equippedPetName" class="equipped-pet-name">No pet equipped!</h3>
                    
                    <div class="row g-3 mt-2">
                        <div class="col-12">
                        <div class="stat-card stat-breed">
                            <span class="stat-icon">⭐</span>
                            <div>
                            <small class="stat-label">Breed</small>
                            <strong id="equippedPetBreed" class="stat-value">-</strong>
                            </div>
                        </div>
                        </div>
                        
                        <div class="col-6">
                        <div class="stat-card stat-level">
                            <span class="stat-icon">📊</span>
                            <div>
                            <small class="stat-label">Level</small>
                            <strong id="equippedPetLevel" class="stat-value">-</strong>
                            </div>
                        </div>
                        </div>
                        
                        <div class="col-6">
                        <div class="stat-card stat-exp">
                            <span class="stat-icon">✨</span>
                            <div>
                            <small class="stat-label">Experience Points</small>
                            <strong id="equippedPetExp" class="stat-value">-</strong>
                            </div>
                        </div>
                        </div>
                    </div>
                    </div>
                </div>
                </div>
            </div>
            </div>
        </div>
        </div>

        <!-- My Pets Section -->
        <div class="row justify-content-center">
        <div class="col-12">
            <div id="petsGrid" class="row g-4">
            <div class="col-12 text-center">
                <p class="text-muted">No pets adopted</p>
            </div>
            </div>
        </div>
        </div>

    <!-- Toast Notification -->

        <span id="toastMessage"></span>
        <button type="button" class="btn-close" onclick="hideToast()"></button>
        </div>
